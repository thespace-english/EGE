const READING_TASK = {

    id: "B3E623",

    title:
        "Should children be allowed to retake tests?",

    text: `

        <p>
            My daughter texted me from school, upset that she’d failed
            a physics test she thought she’d been prepared for.
            She was worried it would bring down her overall grade at
            the end of the first marking period. A half-hour later,
            she texted to say all was good. Her teacher allowed her
            to make corrections – she got all the problems right
            this time, and her grade was no longer under threat.
        </p>

        <p>
            On the one hand, I was pleased that she’d taken the
            initiative to fix what she viewed as a problem.
            On the other hand, I wasn’t sure how I felt about this
            infinite redo approach.
        </p>

        <p>
            When I heard that my daughter was allowed to go back and
            correct her mistakes, my mind instantly went to all the
            professionals in the real world – surgeons, firefighters,
            death-row case trial lawyers, pilots, paramedics, cops
            and more – who really, really needed to get their jobs
            right the first time. With some jobs, “later” isn’t an
            option. Heck, in the realm of less life-and-death
            professions, I spent years working as a live TV show
            producer. <strong>There were no second takes there</strong>,
            either.
        </p>

        <p>
            As with all education research, both pros and cons have
            been tallied and reported. Some of the pros include the
            assertion that letting kids retake tests reduces cheating,
            makes them responsible for their own grades and helps them
            better evaluate their own learning. Cons have been listed
            as: low motivation; students procrastinating until they’ve
            fallen too far behind, leading to stress; and teachers
            needing to teach separate lessons to different class
            members during the same period.
        </p>

        <p>
            Then I turned to my focus group of one: my husband,
            a middle school math and physics teacher who has, for years,
            allowed his students to redo their homework and in-class
            work as many times as they wish in order to get to
            100% mastery. I asked him why he believes his technique
            is beneficial.
        </p>

        <p>
            He stressed that, “Homework and in-class work is formative
            assessment, which is the key here. Homework and in-class
            work is practice. Doing the work correctly over and over
            again is the only way to improve. Tests are summative
            assessments. They measure performance after practice.
            I allow redos only on homework and in-class work.
            I don’t allow resitting tests, because tests measure what
            they’ve learned after all that practice. If you are a
            performing artist, it’s the performance that matters.
            For athletes, it’s the game. Homework versus tests is the
            same thing.”
        </p>

        <p>
            That brings us back to those surgeons, firefighters,
            death-row case trial lawyers, pilots, paramedics, cops
            and more who, in real life, I would really like to get
            their tasks right the first time. Their jobs can be
            considered the ultimate in summative assessment.
            But that assessment didn’t come on the first day of
            training. It came after many, many years of formative
            assessments in the form of arguing mock trials,
            practicing approaches on flight simulators, and conducting
            rescue drills – not to mention taking paper-and-pencil
            tests as well.
        </p>

        <p>
            So much education policy debate these days seems to be
            driven by a zero-sum game mindset. If we do things one way,
            we shouldn’t be doing them another. As the late Stephen
            Sondheim wrote, “Is it always ‘or?’ Is it never ‘and?’”
        </p>

        <p>
            Just as students benefit from a cross-section of classmates,
            they should also benefit from a cross-section of opinions
            on how best to teach. It would better prepare them for
            living and working with a variety of people for the rest
            of their lives, and help them figure out how they learn
            best, so <strong>they</strong> can adapt accordingly.
            That said, I would still prefer that my daughter got her
            physics equations right the first time.
        </p>
    `,


    questions: [

        {
            number: 12,
            answer: "1",
            text:
                "The feelings of the author after her daughter’s second text are best described as …",
            options: [
                "mixed.",
                "disappointment.",
                "relief.",
                "anger."
            ]
        },

        {
            number: 13,
            answer: "3",
            text:
                "What does the phrase “There were no second takes there” in paragraph 3 mean?",
            options: [
                "Only the best ones were hired.",
                "There was very little time to make a decision.",
                "There was only one attempt to do the job.",
                "If you failed for the first time, nobody gave you the second chance."
            ]
        },

        {
            number: 14,
            answer: "2",
            text:
                "Which statement is TRUE?",
            options: [
                "Educators see more pros than cons in retakes.",
                "A negative side of retakes is extra difficulty for teachers.",
                "Without retakes, students become more responsible.",
                "Retaking tests is mostly useful for middle-schoolers."
            ]
        },

        {
            number: 15,
            answer: "1",
            text:
                "Why does the author’s husband allow students to retake homework?",
            options: [
                "It gives students extra practice.",
                "It helps him measure what they have learnt.",
                "It prepares them for jobs like surgeons.",
                "Students usually pass their tests better this way."
            ]
        },

        {
            number: 16,
            answer: "3",
            text:
                "Which technique does the author’s husband believe is the best?",
            options: [
                "Students should retake everything.",
                "No retakes are allowed.",
                "Homework can be retaken, but tests cannot.",
                "Tests can be retaken, but homework cannot."
            ]
        },

        {
            number: 17,
            answer: "1",
            text:
                "What does “they” in the last paragraph refer to?",
            options: [
                "Students.",
                "Opinions.",
                "Lives.",
                "People."
            ]
        },

        {
            number: 18,
            answer: "4",
            text:

                "her daughter was allowed to retake the test.",
                "her daughter got a bad final grade.",
                "her daughter failed her first attempt."
            ]
        }

    ]

};
