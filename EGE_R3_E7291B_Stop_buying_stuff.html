    title: "Stop buying stuff",

    text: `
        <p>
            Did you know that spending 1,000 rubles a day adds up to spending more than 365,000 a year?
            And I don’t know about you, but hardly anything costs under 1,000 where we live.
            So thoughtless spending can add up very quickly. As I try to live more simply,
            I have been trying to mend what we have and make what we need.
            I recently made linen napkins with some fabric we had.
            This way of living has required me to slow down and question whether what I want to buy
            is truly essential. If you also want to live more simply and stop buying stuff you don’t need,
            here are some tips that I’ve found useful.
        </p>

        <p>
            First, you need to identify your motivation. Take a few minutes to think about why you want
            to buy less stuff. Your goal is to buy less, but <i>why</i> are you chasing that goal.
            Some reasons might be to save money, to reduce clutter, to live more sustainably,
            to get out of debt, or to live a more handmade and simple life.
            Once you have your motivation identified, you can refer back to it when you are tempted
            to buy something <b>frivolous</b>.
        </p>

        <p>
            Next, it’s very useful to record your expenses. Don’t worry about setting up a fancy budget
            right now. Just write down everything you buy and how much you spend for one week.
            This is to make you more conscious of your spending habits and help you to stop buying stuff
            you don’t need. Also for one week, write down what prompted you to buy something.
            For example, imagine you bought a new T-shirt. Write it down and think about what made you
            want to buy it. Did you see someone you follow on social media wearing it?
            Did you buy it late at night after a date went badly?
            The goal is to make your invisible purchasing habits more visible.
            As you write down what prompted you to buy something, think about whether the spending
            was emotional or not. Did you get a rush when you pushed ‘buy now’?
            That’s probably an emotional purchase. Try to identify which emotion you’re avoiding.
            Do you feel self-conscious? Or depressed? Once we can name what we’re trying to avoid,
            then we can take steps to meaningfully address <b>it</b>.
        </p>

        <p>
            Have you heard about the One-Year Test? Look around your space.
            Do you see anything you haven’t used in a year? Strongly consider selling or donating it.
            Once you have an understanding of how much you spend and what your spending triggers are,
            it’s time to clean the slate. Unsubscribe from brands on social media and from email newsletters
            from companies or influencers. You want to set yourself up for success and protect yourself
            from being bombarded with emails promising ‘irresistible’ sales.
            Once you know when you are triggered to buy things, you can pre-empt the urge by filling
            the time with something else. For example, if you browse and buy late at night on your phone,
            you can do yoga or meditate or read a good book before bed.
            You don’t need to do this forever – just try to do it once to begin with, and see how you feel.
        </p>

        <p>
            Another very good tip can be summed up as ‘cost versus work.’
            Before you buy something, calculate how much you will need to work to cover the cost.
            If you get paid 300 rubles/hour and something costs 2,500, that’s more than 8 hours of work.
            Is it worth it to you?
        </p>

        <p>
            Before buying something, wait 24 hours. This is a good way to weed out impulse buying.
            Instead of buying things every day, choose one day a week.
            Bookmark everything you want to buy and on the buying day, review all of your bookmarks.
            This is a good way to remove emotional or impulse buying, too.
        </p>

        <p>
            So, buying stuff you don’t need is a major problem for a lot of people.
            The material possessions that you’ve desired and eventually purchased will lose their sparkle,
            and you’ll return to your happiness set point.
            <i>Things</i> can’t make you happy, but <i>people</i> can.
        </p>
    `,
